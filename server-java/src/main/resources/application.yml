server:
  port: 8080

spring:
  config:
    # 本地启动时读取仓库根目录 .env；容器环境变量仍具有更高优先级。
    # file:.env 相对 JVM 工作目录：覆盖从仓库根（mvn -f）与 server-java/（IDE 运行）两种启动方式。
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: zhiyu-server-java
  jackson:
    # 接口字段与票 02 Python 原件一致（snake_case，如 doctor_id / photo_url）
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # 默认 1MB 不够医生头像（票 54 上限 2MB），放宽到 5MB 留余量
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/zhiyu}
    username: ${DATABASE_USER:zhiyu}
    password: ${POSTGRES_PASSWORD:}
  sql:
    init:
      # 启动不再执行任何 DDL/seed：schema 演进统一走 scripts/reset_zhiyu.py（drop+recreate+seed）显式重建，
      # 见 AGENTS.md「运行拓扑」。此前 mode: always 每次启动重放 schema.sql，其中票 49 遗留的
      # DROP TABLE IF EXISTS departments / department_categories 会无条件清空这两张表，导致 B 端后台
      # 人工新增的部门/科室分类每次重启即丢（误删人工业务数据）。
      # 若未来重新启用启动建表，必须先移除 schema.sql 全部破坏性语句（DROP TABLE/DROP COLUMN/结构 hack），
      # 并恢复 encoding: UTF-8 与 data-locations: optional:classpath:seed-knowledge.sql,classpath:seed.sql。
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

zhiyu:
  # 演示占位默认值，生产一律走 .env 注入（硬规则：密钥不入库）
  jwt-secret: ${JWT_SECRET:zhiyu-dev-only-placeholder-secret}
  jwt-expire-minutes: ${JWT_EXPIRE_MINUTES:480}
  # staff_users 演示账号密码由 StaffUserSeed 从 .env 读取，缺省跳过
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:}
    doctor-password: ${SEED_DOCTOR_PASSWORD:}
    doctor2-password: ${SEED_DOCTOR2_PASSWORD:}
    # 其余 13 位医生统一密码（票 57）：缺省 doctor123456，与 AGENTS.md 演示账号约定一致
    doctors-password: ${SEED_DOCTORS_PASSWORD:doctor123456}
  agent:
    base-url: ${SERVER_PY_BASE_URL:http://localhost:8000}
    callback-secret: ${AGENT_CALLBACK_SECRET}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    user: ${NEO4J_USER:neo4j}
    password: ${NEO4J_PASSWORD:}
  minio:
    # 拍照分析原图持久化（ADR-0023）：旁路存储，MinIO 不可用时降级为不留原图不阻断分析。
    # enabled=false 时跳过一切 MinIO 调用（云端未部署时本地仍可开发与测试）。
    enabled: ${MINIO_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:zhiyu-photos}
  knowledge:
    # 向量维度路径 B（ADR-0010）：DDL 写死 vector(2048)，yml 配置默认值，
    # 启动期校验配置维度 == DDL 维度 == endpoint 实际返回，不一致 fail-fast。
    # 维度实际值连 endpoint 探测确认（doubao-embedding-vision 返回 2048）。
    embedding-dimension: ${KNOWLEDGE_EMBEDDING_DIMENSION:2048}
  rate-limit:
    permits-per-minute: 60
  demo:
    # 演示重置三重保护之一（ADR-0022）：默认关闭，未设置或 false 一律拒绝
    reset-enabled: ${DEMO_RESET_ENABLED:false}
    # 票 60 演示开关：随访消息立即可见（跳过契约 delay_days 延迟），默认关闭
    follow-up-visible-immediately: ${DEMO_FOLLOW_UP_VISIBLE_IMMEDIATELY:false}
    # 演示时段覆盖（票 86，ADR-0022 模式）：默认关闭，开启后 admin 可覆盖上午/下午起止，
    # C 端挂号截止与 B 端叫号统一走有效时段窗口
    time-slot-enabled: ${DEMO_TIME_SLOT_ENABLED:false}
