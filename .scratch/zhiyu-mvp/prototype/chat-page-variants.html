<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 v3：三变体存档（非施工标准，仅供回溯）</title>
<!--
  ⚠ 存档文件：这是评审期的三变体对比版（A/B/C + 底部切换条），最终定稿为 A 结构，
  施工标准见同目录 chat-page.html（最终版）与 docs/specs/0002-ui-conventions.md。
  保留理由：B 的情绪变色（整个头部渐变）与 C 的抽屉入口是未采纳但值得回溯的设计。
  v3 内容：导航 [‹][☰][智愈左对齐]；对话记录抽屉；输入栏双行 [语音][档位][咨询人][发送]。
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#dfe3e8; display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  .stage { display:flex; align-items:center; justify-content:center; width:100%; height:100vh; }
  .phone {
    width:375px; height:min(812px, 94vh); background:#f7f8fa;
    border-radius:28px; box-shadow:0 18px 60px rgba(0,0,0,.28);
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }

  /* ============ 导航栏（v3 统一：‹ ☰ 智愈 左对齐） ============ */
  .nav-header { display:flex; align-items:center; gap:14px; padding:12px 14px; background:#fff; }
  .nav-header.bordered { border-bottom:1px solid #eee; }
  .nh-ico { font-size:18px; color:#333; cursor:pointer; line-height:1; }
  .nh-title { font-size:16px; font-weight:600; }

  /* ============ 对话记录抽屉（票 27） ============ */
  .ctx-mask { position:absolute; inset:0; background:rgba(0,0,0,.4); z-index:35;
              opacity:0; pointer-events:none; transition:opacity .2s; }
  .ctx-mask.open { opacity:1; pointer-events:auto; }
  .ctx-drawer { position:absolute; top:0; left:0; bottom:0; width:78%; background:#fff;
                z-index:40; transform:translateX(-105%); transition:transform .22s ease;
                display:flex; flex-direction:column; box-shadow:2px 0 16px rgba(0,0,0,.12); }
  .ctx-drawer.open { transform:translateX(0); }
  .ctx-head { display:flex; justify-content:space-between; align-items:center;
              padding:14px 16px; border-bottom:1px solid #f0f0f0; }
  .ctx-head .t { font-size:16px; font-weight:600; }
  .ctx-new { border:1px solid #0e8a7d; color:#0e8a7d; border-radius:14px; padding:5px 11px;
             font-size:12px; cursor:pointer; background:#fff; }
  .ctx-list { flex:1; overflow-y:auto; }
  .ctx-item { display:flex; justify-content:space-between; align-items:center;
              padding:13px 16px; font-size:14px; color:#333; cursor:pointer; }
  .ctx-item:active { background:#f5f5f5; }
  .ctx-item .ctx-t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctx-del { color:#ccc; font-size:12px; padding:2px 6px; cursor:pointer; }
  .ctx-del:hover { color:#e64545; }

  /* ============ 公共元素 ============ */
  .bubble { max-width:78%; padding:10px 12px; border-radius:12px; font-size:14px; line-height:1.55; margin:8px 0; }
  .bubble.user { align-self:flex-end; background:#95deae; color:#1a1a1a; border-bottom-right-radius:4px; }
  .bubble.ai   { align-self:flex-start; background:#fff; color:#1a1a1a; border-bottom-left-radius:4px;
                 box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .disclaimer-inline { margin-top:6px; padding-top:6px; border-top:1px dashed #e5e5e5;
                       font-size:10px; color:#999; }
  .chat-scroll { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; }
  .guide-card { background:#fff; border-radius:12px; margin:8px 0; padding:12px;
                box-shadow:0 1px 4px rgba(0,0,0,.1); align-self:stretch; }
  .guide-card h4 { font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .guide-card .hint { font-size:11px; color:#999; margin-top:8px; }
  .btn-row { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .card-btn { border:1px solid #0e8a7d; color:#0e8a7d; background:#fff; border-radius:14px;
              padding:6px 12px; font-size:12px; cursor:pointer; }
  .card-btn.primary { background:#0e8a7d; color:#fff; }
  .chip { display:inline-block; border:1px solid #ddd; background:#fff; border-radius:14px;
          padding:5px 11px; font-size:12px; color:#444; cursor:pointer; margin:3px 4px 3px 0; }
  .emo-tag { display:none; font-size:10px; color:#b25f00; background:#fff4e0;
             border-radius:8px; padding:2px 6px; margin-top:6px; width:fit-content; }
  .phone.emo-anxious .emo-tag { display:block; }

  /* ============ 输入栏（v2 统一：双行结构，参考腾讯健康） ============ */
  .composer { background:#fff; border-top:1px solid #eee; padding:8px 10px 10px; }
  .c-row1 { display:flex; }
  .c-row1 input { flex:1; border:none; background:#f2f3f5; border-radius:18px;
                  padding:10px 14px; font-size:14px; outline:none; }
  .hold-talk { display:none; flex:1; background:#f2f3f5; border-radius:18px;
               padding:10px 0; text-align:center; font-size:14px; color:#333; user-select:none; }
  .composer.voice-on .hold-talk { display:block; }
  .composer.voice-on .c-row1 input { display:none; }
  .c-row2 { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .round-btn { width:32px; height:32px; border-radius:50%; background:#f2f3f5; border:none;
               font-size:15px; cursor:pointer; color:#333; }
  .cpill { border:1px solid #e0e0e0; border-radius:14px; padding:5px 11px; font-size:12px;
           color:#333; cursor:pointer; background:#fff; }
  .cpill.gear { color:#0e8a7d; border-color:#0e8a7d; }
  .send-btn { border:none; background:#0e8a7d; color:#fff; border-radius:16px;
              padding:7px 16px; font-size:13px; cursor:pointer; margin-left:auto; }

  /* ============ 变体 A：会话优先 ============ */
  .va-disclaimer-bar { background:#f5f5f5; color:#999; font-size:10px; text-align:center;
                       padding:4px 8px; }
  .va-entries { display:flex; gap:8px; overflow-x:auto; padding:8px 10px 4px; background:#fff; }
  .va-entry { flex:0 0 auto; display:flex; align-items:center; gap:4px; border:1px solid #e0e0e0;
              border-radius:16px; padding:6px 12px; font-size:12px; color:#333; background:#fff;
              cursor:pointer; }
  .va-welcome { background:#fff; border-radius:12px; padding:14px; margin-bottom:8px;
                box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .va-welcome p { font-size:13px; color:#555; margin-bottom:8px; }
  .phone.emo-anxious .bubble.ai.medical { background:#fff8f0; border:1px solid #ffd591; }

  /* ============ 变体 B：功能首页 ============ */
  .vb-hero { background:linear-gradient(135deg,#0e8a7d,#12b8a5); color:#fff; padding:16px 14px 14px; }
  .vb-hero h2 { font-size:18px; font-weight:600; }
  .vb-hero p { font-size:12px; opacity:.85; margin-top:4px; }
  .phone.emo-anxious .vb-hero { background:linear-gradient(135deg,#b25f00,#e8973d); }
  .vb-archive-tip { background:#fffbe8; border:1px solid #ffe58f; border-radius:10px;
                    margin:10px 12px 0; padding:9px 12px; font-size:12px; color:#7a5c00;
                    display:flex; justify-content:space-between; align-items:center; }
  .vb-archive-tip b { color:#0e8a7d; cursor:pointer; }
  .vb-scroll { flex:1; overflow-y:auto; padding-bottom:8px; }
  .vb-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px; }
  .vb-tile { background:#fff; border-radius:12px; padding:14px 12px; cursor:pointer;
             box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .vb-tile .ic { font-size:22px; }
  .vb-tile .nm { font-size:14px; font-weight:600; margin-top:6px; }
  .vb-tile .ds { font-size:11px; color:#999; margin-top:2px; }
  .vb-section { font-size:13px; color:#999; padding:4px 14px 0; }
  .vb-thread { padding:4px 12px; display:flex; flex-direction:column; }
  .vb-disclaimer-fixed { background:#fff7e6; color:#ad6800; font-size:10px; text-align:center;
                         padding:6px 10px; border-top:1px solid #ffe7ba; }

  /* ============ 变体 C：极简 + 抽屉 ============ */
  .vc-disclaimer-float { position:absolute; top:48px; left:50%; transform:translateX(-50%);
                         background:rgba(0,0,0,.55); color:#fff; font-size:10px;
                         border-radius:12px; padding:4px 12px; z-index:10; }
  .vc-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
              padding:24px; gap:14px; }
  .vc-logo { width:64px; height:64px; border-radius:50%; background:#e8f5f2; color:#0e8a7d;
             display:flex; align-items:center; justify-content:center; font-size:30px; }
  .vc-empty h3 { font-size:16px; }
  .vc-prompts { width:100%; display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .vc-prompt { background:#fff; border-radius:10px; padding:11px 13px; font-size:13px;
               color:#333; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .vc-thread { flex:1; overflow-y:auto; padding:12px; display:none; flex-direction:column; }
  .vc-sheet { position:absolute; left:0; right:0; bottom:0; background:#fff;
              border-radius:18px 18px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18);
              padding:16px 14px 20px; transform:translateY(110%); transition:transform .22s ease;
              z-index:30; }
  .vc-sheet.open { transform:translateY(0); }
  .vc-sheet h4 { font-size:14px; margin-bottom:12px; color:#333; }
  .vc-sheet-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .vc-sheet-item { display:flex; flex-direction:column; align-items:center; gap:5px;
                   font-size:12px; color:#333; cursor:pointer; }
  .vc-sheet-item .ic { width:46px; height:46px; border-radius:12px; background:#f2f3f5;
                       display:flex; align-items:center; justify-content:center; font-size:20px; }
  .phone.emo-anxious .bubble.ai.medical { box-shadow:inset 3px 0 0 #e8973d, 0 1px 3px rgba(0,0,0,.08); }

  /* ============ 原型控制（不属于被评估设计） ============ */
  .proto-controls { position:fixed; top:14px; right:14px; background:#222; color:#fff;
                    border-radius:10px; padding:8px 12px; font-size:12px; z-index:100;
                    display:flex; gap:8px; align-items:center; }
  .proto-controls button { border:none; border-radius:6px; padding:5px 10px; cursor:pointer;
                           background:#0e8a7d; color:#fff; font-size:12px; }
  .switcher { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
              background:#111; color:#fff; border-radius:24px; padding:8px 10px;
              display:flex; gap:12px; align-items:center; z-index:100;
              box-shadow:0 6px 20px rgba(0,0,0,.35); font-size:13px; }
  .switcher button { border:none; background:#333; color:#fff; width:32px; height:32px;
                     border-radius:50%; font-size:15px; cursor:pointer; }
  .switcher button:hover { background:#555; }
  .switcher .label { min-width:190px; text-align:center; }
</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone"></div></div>

<div class="proto-controls">
  <span>原型控制 · 模拟情绪</span>
  <button id="emoBtn">平静 → 焦虑</button>
</div>
<div class="switcher">
  <button id="prevBtn">◀</button>
  <span class="label" id="variantLabel"></span>
  <button id="nextBtn">▶</button>
</div>

<script>
/* ---------------- 数据（虚构演示数据） ---------------- */
const ENTRIES = [
  { k:'consult',  icon:'🩺', name:'AI诊室',  desc:'描述症状，智能导诊' },
  { k:'skin',     icon:'📷', name:'拍皮肤',  desc:'拍照分析皮肤问题' },
  { k:'pillbox',  icon:'💊', name:'拍药盒',  desc:'识别药品说明书' },
  { k:'hospital', icon:'📍', name:'找医院',  desc:'按位置和科室推荐' },
  { k:'report',   icon:'📄', name:'看报告',  desc:'解读体检报告' },
  { k:'diet',     icon:'🥗', name:'拍饮食',  desc:'分析一日三餐' },
];
const PROMPTS = [
  '高血压老人用药应该注意什么',
  '为我推荐 28 天健康减肥食谱计划',
  '最近总失眠，有什么调理建议',
];
const CONVOS = [
  '头痛，持续两天了',
  '拍皮肤',
  '高血压老人用药应该注意什么',
  '挂号',
  '找医院',
  '看报告',
  '最近总失眠，有什么调理建议',
];
const GEARS = ['自动', '快速回答', '深度思考'];
const PROFILES = ['本人', '妈妈', '爷爷'];
const DISCLAIMER = '仅供参考，不替代医生诊断';
const DEMO_USER = '最近血压有点偏高，高压 150 左右，怎么办？';
const DEMO_AI = '别太紧张，单次偏高不一定说明问题。建议连续三天早晚各测一次并记录；若持续 ≥140/90，可到心血管内科就诊。平时少盐、规律作息。';

let state = { gear: 0, emo: false, profile: 0 };

/* ---------------- 公共片段 ---------------- */
function esc(s){ return s.replace(/</g,'&lt;'); }
function userBubble(t){ return '<div class="bubble user">' + esc(t) + '</div>'; }
function headerHTML(bordered){
  return '<div class="nav-header' + (bordered ? ' bordered' : '') + '">' +
    '<span class="nh-ico" data-demo>‹</span>' +
    '<span class="nh-ico" data-burger>☰</span>' +
    '<span class="nh-title">智愈</span></div>';
}
function drawerHTML(){
  return '<div class="ctx-mask" id="ctxMask" data-mask></div>' +
  '<div class="ctx-drawer" id="ctxDrawer">' +
    '<div class="ctx-head"><span class="t">对话记录</span>' +
      '<span class="ctx-new" data-newchat>＋ 新对话</span></div>' +
    '<div class="ctx-list">' +
      CONVOS.map(c => '<div class="ctx-item" data-ctxitem><span class="ctx-t">' + esc(c) +
        '</span><span class="ctx-del" data-ctxdel>✕</span></div>').join('') +
    '</div></div>';
}
function demoThreadHTML(inlineDisclaimer){
  return userBubble(DEMO_USER) +
    '<div class="bubble ai medical">' + esc(DEMO_AI) +
    (inlineDisclaimer ? '<div class="disclaimer-inline">⚠ ' + DISCLAIMER + '</div>' : '') +
    '<div class="emo-tag">情绪感知：焦虑 · 已切换安抚语气</div></div>';
}
function composerHTML(placeholder, plus){
  return '<div class="composer" id="composer">' +
    '<div class="c-row1"><input id="cInput" placeholder="' + placeholder + '">' +
      '<div class="hold-talk">按住 说话</div></div>' +
    '<div class="c-row2">' +
      (plus ? '<button class="round-btn" data-sheet>＋</button>' : '') +
      '<button class="round-btn" data-voice>🎤</button>' +
      '<span class="cpill gear" data-gearcycle>' + GEARS[state.gear] + ' ▸</span>' +
      '<span class="cpill" data-profile>' + PROFILES[state.profile] + ' ▸</span>' +
      '<button class="send-btn" data-send>发送</button>' +
    '</div></div>';
}
function guideCardHTML(k){
  if (k === 'hospital') return '<div class="guide-card"><h4>📍 找医院</h4>' +
    '<div class="btn-row"><button class="card-btn primary" data-demo>获取当前位置</button>' +
    '<span style="font-size:12px;color:#999;align-self:center">未定位</span></div>' +
    '<div class="btn-row"><input style="flex:1;border:1px solid #ddd;border-radius:14px;padding:6px 12px;font-size:12px;outline:none" placeholder="输入症状或科室，如：皮肤科">' +
    '<button class="card-btn" data-demo>查询</button></div>' +
    '<div class="hint">将结合你的位置推荐附近医院与科室</div></div>';
  if (k === 'consult') return '<div class="guide-card"><h4>🩺 AI诊室</h4>' +
    '<div style="font-size:13px;color:#444">请描述主要症状和持续时间：</div>' +
    '<div class="btn-row">' + ['头痛','发热','咳嗽','腹痛','乏力'].map(s =>
      '<span class="chip" data-prompt="' + s + '，持续两天了">' + s + '</span>').join('') + '</div></div>';
  const meta = { skin:['📷','拍皮肤','拍摄或上传患处照片，AI 帮你初步分析'],
                 pillbox:['💊','拍药盒','拍摄药盒，查说明书、用法用量与禁忌'],
                 report:['📄','看报告','上传体检报告照片或 PDF，逐页解读'],
                 diet:['🥗','拍饮食','拍摄餐食，估算热量与营养搭配'] }[k];
  return '<div class="guide-card"><h4>' + meta[0] + ' ' + meta[1] + '</h4>' +
    '<div style="font-size:12px;color:#666">' + meta[2] + '</div>' +
    '<div class="btn-row"><button class="card-btn primary" data-demo>拍照</button>' +
    '<button class="card-btn" data-demo>上传图片</button></div></div>';
}

/* ---------------- 变体 A：会话优先 ---------------- */
function renderA(){
  return headerHTML(true) +
  '<div class="chat-scroll" id="chat">' +
    '<div class="va-welcome"><p>你好，我是小愈，你的健康助手。可以试试：</p>' +
      PROMPTS.map(p => '<span class="chip" data-prompt="' + p + '">' + p + '</span>').join('') + '</div>' +
    demoThreadHTML(true) +
  '</div>' +
  '<div class="va-disclaimer-bar">⚠ ' + DISCLAIMER + '</div>' +
  '<div class="va-entries">' +
    ENTRIES.map(e => '<span class="va-entry" data-entry="' + e.k + '">' + e.icon + ' ' + e.name + '</span>').join('') +
  '</div>' +
  composerHTML('描述你的问题…', false) +
  drawerHTML();
}

/* ---------------- 变体 B：功能首页 ---------------- */
function renderB(){
  return headerHTML(false) +
  '<div class="vb-hero"><h2>早上好，今天感觉怎么样？</h2><p>我是小愈，你的 AI 健康助手</p></div>' +
  '<div class="vb-scroll">' +
    '<div class="vb-archive-tip">📋 你还没有健康档案，先建一个？<b data-demo>去创建</b></div>' +
    '<div class="vb-grid">' +
      ENTRIES.map(e => '<div class="vb-tile" data-entry="' + e.k + '"><div class="ic">' + e.icon +
        '</div><div class="nm">' + e.name + '</div><div class="ds">' + e.desc + '</div></div>').join('') +
    '</div>' +
    '<div class="vb-section">推荐问问</div>' +
    '<div style="padding:6px 14px">' + PROMPTS.map(p => '<span class="chip" data-prompt="' + p + '">' + p + '</span>').join('') + '</div>' +
    '<div class="vb-section">对话记录</div>' +
    '<div class="vb-thread" id="chat">' + demoThreadHTML(false) + '</div>' +
  '</div>' +
  '<div class="vb-disclaimer-fixed">⚠ 所有 AI 健康建议' + DISCLAIMER + '</div>' +
  composerHTML('描述你的问题…', false) +
  drawerHTML();
}

/* ---------------- 变体 C：极简 + 抽屉 ---------------- */
function renderC(){
  return headerHTML(false) +
  '<div class="vc-disclaimer-float">⚠ ' + DISCLAIMER + '</div>' +
  '<div class="vc-empty" id="vcEmpty">' +
    '<div class="vc-logo">✚</div><h3>有什么想咨询的？</h3>' +
    '<div class="vc-prompts">' +
      PROMPTS.map(p => '<div class="vc-prompt" data-prompt="' + p + '">' + p + ' →</div>').join('') +
    '</div></div>' +
  '<div class="vc-thread" id="chat" style="display:none"></div>' +
  composerHTML('发消息…', true) +
  '<div class="vc-sheet" id="vcSheet"><h4>选择功能</h4><div class="vc-sheet-grid">' +
    ENTRIES.map(e => '<div class="vc-sheet-item" data-entry="' + e.k + '"><span class="ic">' + e.icon +
      '</span>' + e.name + '</div>').join('') +
  '</div></div>' +
  drawerHTML();
}

/* ---------------- 装配与交互 ---------------- */
const VARIANTS = {
  A: { name:'A — 会话优先 · 入口胶囊（定稿）', render: renderA },
  B: { name:'B — 功能首页 · 宫格面板', render: renderB },
  C: { name:'C — 极简对话 · 抽屉入口', render: renderC },
};
const ORDER = ['A','B','C'];
const phone = document.getElementById('phone');
let cur = new URLSearchParams(location.search).get('variant') || 'A';
if (!VARIANTS[cur]) cur = 'A';

function paint(){
  phone.innerHTML = VARIANTS[cur].render();
  document.getElementById('variantLabel').textContent = VARIANTS[cur].name;
  const u = new URL(location.href); u.searchParams.set('variant', cur);
  history.replaceState(null, '', u);
}
function step(d){
  cur = ORDER[(ORDER.indexOf(cur) + d + ORDER.length) % ORDER.length];
  paint();
}
document.getElementById('prevBtn').onclick = () => step(-1);
document.getElementById('nextBtn').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.getElementById('emoBtn').onclick = function(){
  state.emo = !state.emo;
  phone.classList.toggle('emo-anxious', state.emo);
  this.textContent = state.emo ? '焦虑 → 平静' : '平静 → 焦虑';
};

function openDrawer(){
  phone.querySelector('#ctxDrawer').classList.add('open');
  phone.querySelector('#ctxMask').classList.add('open');
}
function closeDrawer(){
  phone.querySelector('#ctxDrawer').classList.remove('open');
  phone.querySelector('#ctxMask').classList.remove('open');
}
function appendDemoExchange(chat, promptText, inlineDisclaimer){
  chat.insertAdjacentHTML('beforeend', userBubble(promptText));
  chat.insertAdjacentHTML('beforeend',
    '<div class="bubble ai medical">' + esc(DEMO_AI) +
    (inlineDisclaimer ? '<div class="disclaimer-inline">⚠ ' + DISCLAIMER + '</div>' : '') +
    '<div class="emo-tag">情绪感知：焦虑 · 已切换安抚语气</div></div>');
  chat.scrollTop = chat.scrollHeight;
}

phone.addEventListener('click', e => {
  const del = e.target.closest('[data-ctxdel]');
  if (del){ del.parentElement.remove(); return; }

  const t = e.target.closest('[data-entry],[data-prompt],[data-gearcycle],[data-profile],[data-voice],[data-sheet],[data-send],[data-burger],[data-mask],[data-newchat],[data-ctxitem],[data-demo]');
  if (!t) return;
  const chat = phone.querySelector('#chat');

  if (t.hasAttribute('data-burger')) openDrawer();
  if (t.hasAttribute('data-mask')) closeDrawer();
  if (t.hasAttribute('data-newchat')) paint();
  if (t.hasAttribute('data-ctxitem')){
    closeDrawer();
    if (cur === 'C'){
      phone.querySelector('#vcEmpty').style.display = 'none';
      chat.style.display = 'flex';
      chat.innerHTML = demoThreadHTML(true);
    }
  }
  if (t.dataset.entry !== undefined){
    if (cur === 'C'){
      phone.querySelector('#vcEmpty').style.display = 'none';
      chat.style.display = 'flex';
      phone.querySelector('#vcSheet').classList.remove('open');
    }
    chat.insertAdjacentHTML('beforeend', guideCardHTML(t.dataset.entry));
    chat.scrollTop = chat.scrollHeight;
  }
  if (t.dataset.prompt !== undefined){
    if (cur === 'C'){ phone.querySelector('#vcEmpty').style.display = 'none'; chat.style.display = 'flex'; }
    appendDemoExchange(chat, t.dataset.prompt, cur !== 'B');
  }
  if (t.hasAttribute('data-gearcycle')){
    state.gear = (state.gear + 1) % GEARS.length;
    t.textContent = GEARS[state.gear] + ' ▸';
  }
  if (t.hasAttribute('data-profile')){
    state.profile = (state.profile + 1) % PROFILES.length;
    t.textContent = PROFILES[state.profile] + ' ▸';
  }
  if (t.hasAttribute('data-voice')){
    const c = phone.querySelector('#composer');
    c.classList.toggle('voice-on');
    t.textContent = c.classList.contains('voice-on') ? '⌨' : '🎤';
  }
  if (t.hasAttribute('data-sheet')){
    phone.querySelector('#vcSheet').classList.toggle('open');
  }
  if (t.hasAttribute('data-send')){
    const input = phone.querySelector('#cInput');
    const v = input.value.trim(); if (!v) return;
    if (cur === 'C'){ phone.querySelector('#vcEmpty').style.display = 'none'; chat.style.display = 'flex'; }
    appendDemoExchange(chat, v, cur !== 'B');
    input.value = '';
  }
});
paint();
</script>
</body>
</html>
