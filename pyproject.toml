[project]
name = "zhiyu-health"
version = "0.1.0"
description = "智愈医疗 B+C 平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "langchain>=1,<2",
    "langchain-openai>=0.3,<1",
    "langgraph>=0.6,<2",
    "neo4j>=5,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "redis>=6,<8",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 100
src = ["server"]
target-version = "py312"
