[project]
name = "zhiyu-health"
version = "0.1.0"
description = "智愈医疗 B+C 平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain>=1,<2",
    "langchain-openai>=0.3,<1",
    "langgraph>=0.6,<2",
    "neo4j>=5,<7",
    "pillow>=11,<13",
    "pydantic-settings>=2.10,<3",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["server-py"]
testpaths = ["server-py/tests"]

[tool.ruff]
line-length = 100
src = ["server-py"]
target-version = "py312"
