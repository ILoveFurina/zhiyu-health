name: zhiyu-health

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://zhiyu:${POSTGRES_PASSWORD}@postgres:5432/zhiyu
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CORS_ORIGINS: http://43.139.160.223
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)); raise SystemExit(data['status'] != 'ok')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: server/Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://zhiyu:${POSTGRES_PASSWORD}@postgres:5432/zhiyu_test
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_TEST_PASSWORD}
      TEST_DATABASE_URL: postgresql+psycopg://zhiyu:${POSTGRES_PASSWORD}@postgres:5432/zhiyu_test
      TEST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TEST_NEO4J_URI: bolt://neo4j-test:7687
      TEST_NEO4J_USER: neo4j
      TEST_NEO4J_PASSWORD: ${NEO4J_TEST_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhiyu
      POSTGRES_USER: zhiyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyu -d zhiyu"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j-test:
    image: neo4j:5-community
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_TEST_PASSWORD:?请在 .env 中设置 NEO4J_TEST_PASSWORD}
      NEO4J_PASSWORD: ${NEO4J_TEST_PASSWORD:?请在 .env 中设置 NEO4J_TEST_PASSWORD}
    ports:
      - "127.0.0.1:7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
