name: zhiyu-health

# 仅供人工在云服务器首次部署或维护数据库基础设施。
# 日常开发、应用启动与测试均在本地完成；Agent 未经明确授权不得远程执行本文件。

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhiyu
      POSTGRES_USER: zhiyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyu -d zhiyu"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env 中设置 NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j-test:
    image: neo4j:5-community
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_TEST_PASSWORD:?请在 .env 中设置 NEO4J_TEST_PASSWORD}
    ports:
      - "7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 拍照分析原图持久化（ADR-0023）：仅存拍照分析图片，业务数据仍走 PostgreSQL。
  # MinIO 是旁路持久化，不介入视觉分析热路径，server-py 取图仍由 server-java 字节流透传。
  #
  # 云服务器一键启停（与 PG/Redis/Neo4j 同姿态）：
  #   1) 服务器 .env 补齐 MINIO_ACCESS_KEY / MINIO_SECRET_KEY / MINIO_BUCKET
  #      （全新部署跑 deploy/bootstrap-env.sh 会一并生成；旧 .env 直接追加三个变量即可）
  #   2) docker compose up -d  # 启动全部云数据服务（含 MinIO）
  #      docker compose down   # 停止容器；named volume 保留数据，启停不丢
  #   3) 校验：docker compose ps 中 minio 为 healthy 即就绪
  minio:
    # latest 指向最近稳定发布，便于一键启停；如需固定版本可改为具体 RELEASE tag（格式 RELEASE.YYYY-MM-DDTHH-MM-SSZ）。
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # MINIO_ROOT_USER 即根访问密钥、MINIO_ROOT_PASSWORD 即根秘密密钥，对应 .env 的
      # MINIO_ACCESS_KEY / MINIO_SECRET_KEY（access key ≥3 位、secret key ≥8 位）。
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 中设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 中设置 MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API：server-java 的 MINIO_ENDPOINT 直连，云服务器安全组需放行
      - "9001:9001"   # Web 管理台：http://<服务器IP>:9001
    volumes:
      - minio-data:/data
    healthcheck:
      # 官方镜像自带 mc 且预置 local 别名（镜像内不含 curl）；`mc ready local` 探测 :9000 就绪。
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  minio-data:
